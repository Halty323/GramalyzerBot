[package]
name = "gramalyzer-desktop"
version = "0.1.0"
edition = "2024"
description = "Gramalyzer Studio: the desktop client for a Gramalyzer backend, with an AI writing assistant"
license = "MIT"
publish = false

[dependencies]
iced = { version = "0.14", features = ["canvas", "tokio", "image", "advanced", "advanced-shaping"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "fs"] }
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
directories = "6"
rfd = { version = "0.15", default-features = false, features = ["xdg-portal", "tokio"] }
open = "5"
futures = "0.3"
bytes = "1"
base64 = "0.22"

[profile.release]
opt-level = 3
lto = "thin"
strip = true
