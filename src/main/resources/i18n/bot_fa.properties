# ---------------------------------------------------------------- help
help.title=❓ <b>Gramalyzer چطور کار می‌کند</b>
help.collect.title=<b>۱ · جمع‌آوری</b>
help.collect=وقتی ادمین کانالتان شوم، هر پست جدید را با واکنش‌هایش ثبت می‌کنم – و نظرها را هم، اگر گروه گفتگو را وصل کنید. تاریخچه از روز اول می‌خواهید؟ خروجی Telegram را وارد کنید.
help.analyse.title=<b>۲ · تحلیل</b>
help.analyse=پست‌ها را بر اساس روز، ساعت، قالب، طول، موضوع و کلمات مقایسه می‌کنم و نمونه‌های کوچک را تعدیل می‌کنم تا یک پست خوش‌شانس شبیه روند به نظر نرسد.
help.advise.title=<b>۳ · توصیه</b>
help.advise=بهترین زمان‌ها، ایده‌های محتوا، خلاصه هفتگی و یادآورهای اختیاری «الان وقت خوبی است».
help.watch.title=<b>🔭 فهرست پیگیری</b>
help.watch=هر کانال عمومی را – مال خودتان یا دیگران – بدون اضافه کردن من دنبال کنید: اعضا، میانگین بازدید، نرخ تعامل و برترین پست‌ها. /track @username را بفرستید.
help.cant_see.title=<b>چیزهایی که نمی‌بینم</b>
help.cant_see=Telegram بازدیدهای کانال خودتان را به ربات‌ها نمی‌دهد، پس «عملکرد» یعنی <b>واکنش‌ها + نظرها</b>. برای بهترین نتیجه واکنش‌ها را در کانال روشن کنید.
help.team.title=<b>تیم</b>
help.team=👑 مالک – همه‌چیز · 🛡 ادمین – تنظیمات و ناظرها · 🔎 ناظر – آمار، برچسب زدن یا کنار گذاشتن پست‌ها.
