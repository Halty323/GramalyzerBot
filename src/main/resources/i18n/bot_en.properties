# ---------------------------------------------------------------- help
help.title=❓ <b>How Gramalyzer works</b>
help.collect.title=<b>1 · Collect</b>
help.collect=Once I'm an admin of your channel I record every new post with its reactions – and comments, if you link the discussion group. Want history from day one? Import a Telegram export.
help.analyse.title=<b>2 · Analyse</b>
help.analyse=I compare posts by weekday, hour, format, length, topics and keywords, and shrink small samples so one lucky post doesn't look like a trend.
help.advise.title=<b>3 · Advise</b>
help.advise=Best times, content ideas, a weekly digest and optional “now is a good time” nudges.
help.watch.title=<b>🔭 Watchlist</b>
help.watch=Keep an eye on any public channel – yours or not – without adding me to it: subscribers, average views, engagement rate and top posts. Send /track @username.
help.cant_see.title=<b>What I can't see</b>
help.cant_see=Telegram doesn't give bots view counts for your own channel, so “performance” means <b>reactions + comments</b>. Enable reactions on your channel for the best results.
help.team.title=<b>Team</b>
help.team=👑 Owner – everything · 🛡 Admin – settings &amp; moderators · 🔎 Moderator – insights, tag or exclude posts.
help.tip=<i>Tip: the buttons under the chat box jump straight to the main screens.</i>
help.back_dashboard=‹ Back to dashboard

