# Keys ending in .one/.few/.many/.other are counted phrases: {0} is the number. English uses .one and .other;
# other languages add the plural forms they need (Russian/Ukrainian: one, few, many; Arabic: zero, one, two, few, many, other).
# Missing keys fall back to English.

