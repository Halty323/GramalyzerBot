# ---------------------------------------------------------------- help
help.title=❓ <b>Cómo funciona Gramalyzer</b>
help.collect.title=<b>1 · Recopilar</b>
help.collect=Cuando soy admin de tu canal registro cada nueva publicación con sus reacciones – y los comentarios, si vinculas el grupo de discusión. ¿Quieres el historial desde el primer día? Importa una exportación de Telegram.
help.analyse.title=<b>2 · Analizar</b>
help.analyse=Comparo las publicaciones por día, hora, formato, longitud, temas y palabras clave, y suavizo las muestras pequeñas para que una publicación con suerte no parezca una tendencia.
help.advise.title=<b>3 · Aconsejar</b>
help.advise=Mejores horas, ideas de contenido, un resumen semanal y avisos opcionales de “ahora es buen momento”.
help.watch.title=<b>🔭 Seguimiento</b>
help.watch=Sigue de cerca cualquier canal público – tuyo o no – sin añadirme: suscriptores, vistas medias, tasa de interacción y mejores publicaciones. Envía /track @username.
help.cant_see.title=<b>Lo que no puedo ver</b>
help.cant_see=Telegram no da a los bots las vistas de tu propio canal, así que “rendimiento” significa <b>reacciones + comentarios</b>. Activa las reacciones en tu canal para obtener mejores resultados.
help.team.title=<b>Equipo</b>
help.team=👑 Propietario – todo · 🛡 Admin – ajustes y moderadores · 🔎 Moderador – estadísticas, etiquetar o excluir publicaciones.
help.tip=<i>Consejo: los botones bajo el cuadro de texto llevan directo a las pantallas principales.</i>
help.back_dashboard=‹ Volver al panel

