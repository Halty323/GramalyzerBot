# ---------------------------------------------------------------- help
help.title=❓ <b>Gramalyzer hoạt động thế nào</b>
help.collect.title=<b>1 · Thu thập</b>
help.collect=Khi là quản trị viên kênh của bạn, tôi ghi lại mọi bài mới cùng lượt cảm xúc – và cả bình luận nếu bạn liên kết nhóm thảo luận. Muốn có lịch sử từ ngày đầu? Hãy nhập tệp xuất từ Telegram.
help.analyse.title=<b>2 · Phân tích</b>
help.analyse=Tôi so sánh bài đăng theo thứ, giờ, định dạng, độ dài, chủ đề và từ khóa, đồng thời làm mượt các mẫu nhỏ để một bài may mắn không bị coi là xu hướng.
help.advise.title=<b>3 · Gợi ý</b>
help.advise=Giờ đăng tốt nhất, ý tưởng nội dung, bản tóm tắt hàng tuần và nhắc nhở tùy chọn “bây giờ là lúc tốt”.
help.watch.title=<b>🔭 Danh sách theo dõi</b>
help.watch=Theo dõi bất kỳ kênh công khai nào – của bạn hay không – mà không cần thêm tôi: người đăng ký, lượt xem trung bình, tỷ lệ tương tác và bài nổi bật. Gửi /track @username.
help.cant_see.title=<b>Những gì tôi không thấy được</b>
help.cant_see=Telegram không cho bot biết lượt xem của chính kênh bạn, nên “hiệu quả” nghĩa là <b>cảm xúc + bình luận</b>. Hãy bật cảm xúc trên kênh để có kết quả tốt nhất.
help.team.title=<b>Nhóm</b>
help.team=👑 Chủ sở hữu – mọi thứ · 🛡 Quản trị viên – cài đặt và kiểm duyệt viên · 🔎 Kiểm duyệt viên – thống kê, gắn nhãn hoặc loại bài.
help.tip=<i>Mẹo: các nút dưới ô nhập tin nhắn mở thẳng các màn hình chính.</i>
help.back_dashboard=‹ Về bảng điều khiển

