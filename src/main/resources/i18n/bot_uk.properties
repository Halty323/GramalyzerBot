# ---------------------------------------------------------------- help
help.title=❓ <b>Як працює Gramalyzer</b>
help.collect.title=<b>1 · Збір</b>
help.collect=Ставши адміном вашого каналу, я записую кожен новий пост із реакціями – і коментарями, якщо прив'язати групу обговорень. Потрібна історія з першого дня? Імпортуйте експорт із Telegram.
help.analyse.title=<b>2 · Аналіз</b>
help.analyse=Я порівнюю пости за днями тижня, годинами, форматом, довжиною, темами й словами та згладжую малі вибірки, щоб один вдалий пост не виглядав трендом.
help.advise.title=<b>3 · Поради</b>
help.advise=Найкращий час, ідеї для постів, щотижневе зведення і, за бажанням, нагадування «зараз гарний час».
help.watch.title=<b>🔭 Відстежувані</b>
help.watch=Стежте за будь-яким публічним каналом – своїм чи чужим – без додавання мене: підписники, середні перегляди, залученість і найкращі пости. Надішліть /track @username.
help.cant_see.title=<b>Чого я не бачу</b>
help.cant_see=Telegram не дає ботам перегляди вашого власного каналу, тому «ефективність» – це <b>реакції + коментарі</b>. Увімкніть реакції в каналі для найкращих результатів.
help.team.title=<b>Команда</b>
help.team=👑 Власник – усе · 🛡 Адмін – налаштування й модератори · 🔎 Модератор – аналітика, теги та виключення постів.
help.tip=<i>Порада: кнопки під полем введення одразу відкривають основні екрани.</i>
help.back_dashboard=‹ До зведення

