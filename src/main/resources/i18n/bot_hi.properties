# ---------------------------------------------------------------- help
help.title=❓ <b>Gramalyzer कैसे काम करता है</b>
help.collect.title=<b>1 · इकट्ठा करना</b>
help.collect=आपके चैनल का एडमिन बनते ही मैं हर नया पोस्ट उसके रिएक्शन के साथ दर्ज करता हूँ – और कमेंट भी, अगर आप डिस्कशन ग्रुप जोड़ें। पहले दिन से इतिहास चाहिए? Telegram एक्सपोर्ट इम्पोर्ट करें।
help.analyse.title=<b>2 · विश्लेषण</b>
help.analyse=मैं पोस्ट की तुलना दिन, घंटे, फ़ॉर्मेट, लंबाई, विषय और शब्दों से करता हूँ, और छोटे सैंपल को संतुलित करता हूँ ताकि एक लकी पोस्ट ट्रेंड न लगे।
help.advise.title=<b>3 · सलाह</b>
help.advise=सबसे अच्छा समय, कंटेंट आइडिया, साप्ताहिक डाइजेस्ट और चाहें तो “अभी अच्छा समय है” वाले रिमाइंडर।
help.watch.title=<b>🔭 वॉचलिस्ट</b>
help.watch=किसी भी पब्लिक चैनल पर नज़र रखें – आपका हो या नहीं – मुझे उसमें जोड़े बिना: सब्सक्राइबर, औसत व्यूज़, एंगेजमेंट रेट और टॉप पोस्ट। /track @username भेजें।
help.cant_see.title=<b>मैं क्या नहीं देख सकता</b>
help.cant_see=Telegram बॉट्स को आपके अपने चैनल के व्यूज़ नहीं देता, इसलिए “परफ़ॉर्मेंस” का मतलब है <b>रिएक्शन + कमेंट</b>। अच्छे नतीजों के लिए चैनल पर रिएक्शन चालू करें।
help.team.title=<b>टीम</b>
help.team=👑 मालिक – सब कुछ · 🛡 एडमिन – सेटिंग्स और मॉडरेटर · 🔎 मॉडरेटर – इनसाइट्स, पोस्ट टैग या बाहर करना।
