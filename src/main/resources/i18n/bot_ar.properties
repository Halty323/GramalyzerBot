# ---------------------------------------------------------------- help
help.title=❓ <b>كيف يعمل Gramalyzer</b>
help.collect.title=<b>1 · الجمع</b>
help.collect=بمجرد أن أصبح مديرًا لقناتك أسجل كل منشور جديد مع تفاعلاته – والتعليقات إن ربطت مجموعة النقاش. تريد السجل منذ اليوم الأول؟ استورد ملف تصدير من Telegram.
help.analyse.title=<b>2 · التحليل</b>
help.analyse=أقارن المنشورات حسب اليوم والساعة والصيغة والطول والمواضيع والكلمات، وأخفف أثر العينات الصغيرة حتى لا يبدو منشور محظوظ واحد وكأنه اتجاه.
help.advise.title=<b>3 · النصيحة</b>
help.advise=أفضل الأوقات، أفكار للمحتوى، ملخص أسبوعي، وتنبيهات اختيارية «الآن وقت مناسب».
help.watch.title=<b>🔭 قائمة المتابعة</b>
help.watch=تابع أي قناة عامة – قناتك أو غيرها – دون إضافتي إليها: المشتركون، متوسط المشاهدات، معدل التفاعل وأفضل المنشورات. أرسل /track @username.
help.cant_see.title=<b>ما لا أستطيع رؤيته</b>
help.cant_see=لا يعطي Telegram البوتات عدد مشاهدات قناتك، لذا «الأداء» يعني <b>التفاعلات + التعليقات</b>. فعّل التفاعلات في قناتك لأفضل النتائج.
help.team.title=<b>الفريق</b>
help.team=👑 المالك – كل شيء · 🛡 المدير – الإعدادات والمشرفون · 🔎 المشرف – الإحصاءات ووسم المنشورات أو استبعادها.
help.tip=<i>نصيحة: الأزرار أسفل مربع الكتابة تفتح الشاشات الرئيسية مباشرة.</i>
help.back_dashboard=‹ العودة إلى اللوحة

