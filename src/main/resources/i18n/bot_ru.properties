# ---------------------------------------------------------------- help
help.title=❓ <b>Как работает Gramalyzer</b>
help.collect.title=<b>1 · Сбор</b>
help.collect=Став админом вашего канала, я записываю каждый новый пост с реакциями – и комментариями, если привязать группу обсуждений. Нужна история с первого дня? Импортируйте экспорт из Telegram.
help.analyse.title=<b>2 · Анализ</b>
help.analyse=Я сравниваю посты по дням недели, часам, формату, длине, темам и словам и сглаживаю маленькие выборки, чтобы один удачный пост не выглядел трендом.
help.advise.title=<b>3 · Советы</b>
help.advise=Лучшее время, идеи для постов, еженедельная сводка и, по желанию, напоминания «сейчас хорошее время».
help.watch.title=<b>🔭 Отслеживаемые</b>
help.watch=Следите за любым публичным каналом – своим или чужим – без добавления меня: подписчики, средние просмотры, вовлечённость и лучшие посты. Отправьте /track @username.
help.cant_see.title=<b>Чего я не вижу</b>
help.cant_see=Telegram не даёт ботам просмотры вашего собственного канала, поэтому «эффективность» – это <b>реакции + комментарии</b>. Включите реакции в канале для лучших результатов.
help.team.title=<b>Команда</b>
help.team=👑 Владелец – всё · 🛡 Админ – настройки и модераторы · 🔎 Модератор – аналитика, теги и исключение постов.
help.tip=<i>Совет: кнопки под полем ввода сразу открывают основные экраны.</i>
help.back_dashboard=‹ К сводке

