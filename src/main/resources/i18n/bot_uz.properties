# ---------------------------------------------------------------- help
help.title=❓ <b>Gramalyzer qanday ishlaydi</b>
help.collect.title=<b>1 · Yigʻish</b>
help.collect=Kanalingizga admin boʻlganimdan soʻng har bir yangi postni reaksiyalari bilan yozib boraman – muhokama guruhini ulasangiz, izohlarni ham. Birinchi kundan tarix kerakmi? Telegram eksportini import qiling.
help.analyse.title=<b>2 · Tahlil</b>
help.analyse=Postlarni hafta kuni, soat, format, uzunlik, mavzu va kalit soʻzlar boʻyicha solishtiraman, kichik namunalarni yumshataman – shunda bitta omadli post trend boʻlib koʻrinmaydi.
help.advise.title=<b>3 · Maslahat</b>
help.advise=Eng yaxshi vaqtlar, kontent gʻoyalari, haftalik xulosa va ixtiyoriy «hozir yaxshi vaqt» eslatmalari.
help.watch.title=<b>🔭 Kuzatuv roʻyxati</b>
help.watch=Istalgan ochiq kanalni – sizniki boʻlsin yoki yoʻq – meni qoʻshmasdan kuzating: obunachilar, oʻrtacha koʻrishlar, faollik darajasi va eng yaxshi postlar. /track @username yuboring.
help.cant_see.title=<b>Men koʻra olmaydigan narsalar</b>
help.cant_see=Telegram botlarga oʻz kanalingiz koʻrishlar sonini bermaydi, shuning uchun «samaradorlik» bu <b>reaksiyalar + izohlar</b>. Eng yaxshi natija uchun kanalda reaksiyalarni yoqing.
help.team.title=<b>Jamoa</b>
help.team=👑 Egasi – hammasi · 🛡 Admin – sozlamalar va moderatorlar · 🔎 Moderator – tahlillar, postlarni belgilash yoki chiqarib tashlash.
help.tip=<i>Maslahat: yozish maydoni ostidagi tugmalar asosiy ekranlarni darhol ochadi.</i>
