# ---------------------------------------------------------------- help
help.title=❓ <b>Cara kerja Gramalyzer</b>
help.collect.title=<b>1 · Kumpulkan</b>
help.collect=Setelah saya menjadi admin kanal Anda, saya mencatat setiap postingan baru beserta reaksinya – dan komentar, jika grup diskusi dihubungkan. Ingin riwayat sejak hari pertama? Impor ekspor Telegram.
help.analyse.title=<b>2 · Analisis</b>
help.analyse=Saya membandingkan postingan menurut hari, jam, format, panjang, topik, dan kata kunci, serta meredam sampel kecil agar satu postingan yang beruntung tidak terlihat seperti tren.
help.advise.title=<b>3 · Saran</b>
help.advise=Waktu terbaik, ide konten, ringkasan mingguan, dan pengingat opsional “sekarang waktu yang tepat”.
help.watch.title=<b>🔭 Pantauan</b>
help.watch=Pantau kanal publik mana pun – milik Anda atau bukan – tanpa menambahkan saya: pelanggan, rata-rata tayangan, tingkat interaksi, dan postingan teratas. Kirim /track @username.
help.cant_see.title=<b>Yang tidak bisa saya lihat</b>
help.cant_see=Telegram tidak memberi bot jumlah tayangan kanal Anda sendiri, jadi “performa” berarti <b>reaksi + komentar</b>. Aktifkan reaksi di kanal Anda untuk hasil terbaik.
help.team.title=<b>Tim</b>
help.team=👑 Pemilik – semuanya · 🛡 Admin – pengaturan &amp; moderator · 🔎 Moderator – wawasan, menandai atau mengecualikan postingan.
help.tip=<i>Tips: tombol di bawah kotak obrolan langsung membuka layar utama.</i>
help.back_dashboard=‹ Kembali ke dasbor

