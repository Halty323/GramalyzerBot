help.watch=Herhangi bir herkese açık kanalı – senin olsun ya da olmasın – beni eklemeden takip et: aboneler, ortalama görüntülenme, etkileşim oranı ve en iyi gönderiler. /track @username gönder.
help.cant_see.title=<b>Göremediklerim</b>
help.cant_see=Telegram botlara kendi kanalının görüntülenme sayılarını vermez, bu yüzden “performans” <b>tepkiler + yorumlar</b> demektir. En iyi sonuç için kanalında tepkileri aç.
