help.title=❓ <b>Gramalyzer nasıl çalışır</b>
help.collect.title=<b>1 · Topla</b>
help.collect=Kanalının yöneticisi olduğumda her yeni gönderiyi tepkileriyle kaydederim – tartışma grubunu bağlarsan yorumları da. İlk günden itibaren geçmiş mi istiyorsun? Bir Telegram dışa aktarımını içe aktar.
