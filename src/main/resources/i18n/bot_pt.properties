# ---------------------------------------------------------------- help
help.title=❓ <b>Como o Gramalyzer funciona</b>
help.collect.title=<b>1 · Coletar</b>
help.collect=Quando viro admin do seu canal, registro cada novo post com suas reações – e comentários, se você vincular o grupo de discussão. Quer o histórico desde o primeiro dia? Importe uma exportação do Telegram.
help.analyse.title=<b>2 · Analisar</b>
help.analyse=Comparo os posts por dia da semana, hora, formato, tamanho, temas e palavras-chave, e suavizo amostras pequenas para que um post de sorte não pareça tendência.
help.advise.title=<b>3 · Aconselhar</b>
help.advise=Melhores horários, ideias de conteúdo, um resumo semanal e lembretes opcionais de “agora é uma boa hora”.
help.watch.title=<b>🔭 Monitorados</b>
help.watch=Acompanhe qualquer canal público – seu ou não – sem me adicionar: inscritos, média de visualizações, taxa de engajamento e melhores posts. Envie /track @username.
help.cant_see.title=<b>O que eu não vejo</b>
help.cant_see=O Telegram não dá aos bots as visualizações do seu próprio canal, então “desempenho” significa <b>reações + comentários</b>. Ative as reações no seu canal para melhores resultados.
help.team.title=<b>Equipe</b>
help.team=👑 Dono – tudo · 🛡 Admin – configurações e moderadores · 🔎 Moderador – insights, marcar ou excluir posts.
help.tip=<i>Dica: os botões abaixo da caixa de mensagem levam direto às telas principais.</i>
help.back_dashboard=‹ Voltar ao painel

