# Built-in defaults. They have the lowest precedence: your own src/main/resources/application.yml (kept out of
# git), application-demo.yml, environment variables and command-line arguments all override them.
# Every value can also be set through the environment variable shown in ${...}.

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:file:./.data/gramalyzer;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.web.resources.static-locations=${GRAMALYZER_WEB_ROOT:file:../GramalyzerVibe/dist/}

server.port=${PORT:8080}
server.address=${HOST:127.0.0.1}
server.forward-headers-strategy=framework

telegram.bot.enabled=${TELEGRAM_BOT_ENABLED:false}
# From @BotFather; provide it through the environment, never commit it.
telegram.bot.token=${TELEGRAM_BOT_TOKEN:}
# Bot administrators: comma-separated @usernames and/or numeric user ids (BOT_ADMIN_IDS is the old name).
telegram.bot.admins=${BOT_ADMINS:${BOT_ADMIN_IDS:}}
telegram.bot.public-registration=${BOT_PUBLIC_REGISTRATION:true}
telegram.bot.default-timezone=${BOT_DEFAULT_TIMEZONE:UTC}

gramalyzer.demo=${DEMO_MODE:false}
gramalyzer.api-token=${GRAMALYZER_API_TOKEN:}

# Public channels watched from the website and the bot (read from t.me/s/<username>, no bot membership needed).
gramalyzer.tracking.refresh-enabled=${TRACKING_REFRESH_ENABLED:true}
gramalyzer.tracking.refresh-every=${TRACKING_REFRESH_EVERY:PT2H}
gramalyzer.tracking.max-per-person=${TRACKING_MAX_PER_PERSON:20}
gramalyzer.tracking.max-web=${TRACKING_MAX_WEB:100}

# Paid plans in the bot, billed as monthly Telegram Stars subscriptions. Off by default so local runs and the demo
# have no limits; compose.yaml switches it on for live servers.
gramalyzer.billing.enabled=${BILLING_ENABLED:false}
gramalyzer.billing.creator-stars=${BILLING_CREATOR_STARS:250}
gramalyzer.billing.pro-stars=${BILLING_PRO_STARS:750}

# Every managed and watched channel is refreshed when the server starts, before it stops, and when the website or
# Studio opens or closes (POST /api/refresh, at most once a minute). The stop pass gets a time budget; channels it
# doesn't reach are read first on the next start. Keep docker's stop_grace_period above budget + 15s.
gramalyzer.refresh.on-start=${REFRESH_ON_START:true}
gramalyzer.refresh.on-stop=${REFRESH_ON_STOP:true}
gramalyzer.refresh.stop-budget=${REFRESH_STOP_BUDGET:PT25S}
gramalyzer.refresh.cooldown=${REFRESH_COOLDOWN:PT1M}

# The built-in H2 database is copied to a zip daily and on every shutdown (ignored with PostgreSQL).
gramalyzer.backup.enabled=${BACKUP_ENABLED:true}
gramalyzer.backup.dir=${BACKUP_DIR:./.data/backups}
gramalyzer.backup.keep=${BACKUP_KEEP:7}

# Finish requests in flight on shutdown instead of cutting them off.
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=15s
